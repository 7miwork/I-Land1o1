    <!-- Eigene Supabase-Login-Seite (ersetzt die alte React-Demo-Anmeldung) -->
  <script>
    try { sessionStorage.setItem('iland:useOwnLogin', '1'); } catch (e) { /* Private Mode */ }
  </script>
  <!-- Direkt-Redirect: Falls /login geladen wird (SPA liefert immer index.html), sofort zum neuen Login weiterleiten -->
  <script>
    (function () {
      var path = window.location.pathname;
      if (path === '/login' || path === '/login/') {
        window.location.replace('/login/index.html');
      }
    })();
  </script>
  <!-- Redirect: eingeloggte Nutzer von der Startseite (/) automatisch zum Dashboard -->
  <script>
    (function () {
      if (window.location.pathname !== '/') return;
      var cfg = window.ILAND_CONFIG || {};
      if (!cfg.SUPABASE_URL || !window.supabase) return;
      var client = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);
      client.auth.getSession().then(function (result) {
        if (result && result.session && result.session.user) {
          window.location.replace('/dashboard/');
        }
      });
    })();
  </script>
  <!-- Login-Link-Fix: alle /login Links sofort und dauerhaft auf /login/index.html umleiten -->
  <script>
    (function () {
      function fixLoginLinks() {
        document.querySelectorAll('a[href*="/login"]').forEach(function (a) {
          var href = a.getAttribute('href') || '';
          if (href.indexOf('/login/index.html') === -1 && href.indexOf('/login/') === -1) {
            a.href = '/login/index.html';
          }
        });
      }
      fixLoginLinks();

      // Klick-Handler: falls doch ein alter /login Link geklickt wird, direkt redirecten
      document.addEventListener('click', function (e) {
        var link = e.target.closest('a');
        if (!link) return;
        var href = link.getAttribute('href') || '';
        if (href === '/login' || href === '/login/') {
          e.preventDefault();
          window.location.href = '/login/index.html';
        }
      });

      // Observer für nachträglich eingefügte React-Elemente
      var observer = new MutationObserver(function (mutations) {
        var shouldFix = false;
        mutations.forEach(function (m) {
          m.addedNodes.forEach(function (node) {
            if (node.nodeType === 1) {
              if (node.matches && node.matches('a[href*="/login]')) shouldFix = true;
              if (node.querySelectorAll && node.querySelectorAll('a[href*="/login"]').length > 0) shouldFix = true;
            }
          });
        });
        if (shouldFix) fixLoginLinks();
      });
      observer.observe(document.body, { childList: true, subtree: true });
    })();
  </script>
