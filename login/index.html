<!doctype html>
<html lang="de">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | I-Land1o1 Learning Platform</title>
  <meta name="description" content="Anmelden bei I-Land1o1 – dein Zugang zu den Coding-Abenteuern." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&family=Press+Start+2P&family=Pirata+One&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="/dashboard/dashboard.css" />
  <link rel="stylesheet" href="login.css" />
</head>

<body>
  <!-- Kopfbereich im Stil der Hauptseite -->
  <section class="hero">
    <div class="hero-inner">
      <p class="kicker">⚓ WELCOME BACK</p>
      <h1>Login</h1>
      <p class="sub">Melde dich an, um deine Coding-Abenteuer fortzusetzen.</p>
    </div>
  </section>

  <!-- Login / Registrierung -->
  <section class="card-wrap">
    <div class="card">
      <div class="icon-badge">⚓</div>
      <h2 id="formTitle">Willkommen zurück!</h2>

      <div class="tabs">
        <button type="button" class="tab active" id="tabLogin">Anmelden</button>
        <button type="button" class="tab" id="tabSignup">Registrieren</button>
      </div>

      <form id="loginForm" novalidate>
        <div id="signupFields" hidden>
          <div class="role-row">
            <label class="role"><input type="radio" name="role" value="student" checked />
              <span>⛏️ Kind</span></label>
            <label class="role"><input type="radio" name="role" value="parent" />
              <span>👨‍👩‍👧 Elternteil</span></label>
          </div>

          <label class="field-label" for="name">Dein Name</label>
          <input id="name" type="text" autocomplete="name" placeholder="z. B. kleine Piratin" />

          <div id="inviteBlock" hidden>
            <label class="field-label" for="invite">Eltern-Code (falls vorhanden)</label>
            <input id="invite" type="text" placeholder="ILAND-XXXXXX" />
            <p class="hint">Noch kein Code? Registriere dich einfach – dein Elternteil kann ihn
              dir später im Dashboard geben.</p>
          </div>
        </div>

        <label class="field-label" for="email">Email</label>
        <input id="email" type="email" autocomplete="email" required placeholder="du@beispiel.de" />

        <label class="field-label" for="password">Passwort</label>
        <input id="password" type="password" autocomplete="current-password" required minlength="6"
          placeholder="••••••••" />

        <button type="submit" class="submit" id="submit">Anmelden ⚓</button>
      </form>

      <p class="error" id="error" hidden></p>
      <a class="back-link" href="/">← Zurück zur Webseite</a>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/dashboard/config.js"></script>
  <script src="login.js"></script>
</body>

</html>
